name: Build Clientizen

on:
  push:
    branches: [ "stable-1.21.10", "updated-1.21.10" ]
  pull_request:
    branches: [ "stable-1.21.10", "updated-1.21.10" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Clientizen-Jars
        path: build/libs/*.jar
        compression-level: 0
